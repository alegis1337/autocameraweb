<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Мониторинг видеонаблюдения</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" method="post" action="/login">
      <h1>Мониторинг видеонаблюдения</h1>
      <p class="sub">Состояние камер по объектам</p>
      <label for="username">Логин</label>
      <input id="username" name="username" autocomplete="username" maxlength="64" autofocus required>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
      <div class="login-error" id="err" hidden>Неверный логин или пароль</div>
      <div class="login-error" id="err-limit" hidden>Слишком много неудачных попыток — вход закрыт на 15 минут</div>
    </form>
  </div>
  <!-- Скрипт вынесен в файл: inline-скрипты запрещены Content-Security-Policy. -->
  <script src="/login.js"></script>
</body>
</html>
